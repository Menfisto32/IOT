; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/cu.wchusbserial5B900904051
monitor_port = /dev/cu.wchusbserial5B900904051

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.psram_type = opi
board_build.partitions = default_8MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    fastled/FastLED @ ^3.6.0
    paulstoffregen/OneWire @ ^2.3.7
    milesburton/DallasTemperature @ ^3.11.0

[env:prog1]
build_src_filter = -<*> +<prog1_serial.cpp>

[env:prog2]
build_src_filter = -<*> +<prog2_blocking.cpp>

[env:prog3]
build_src_filter = -<*> +<prog3_millis.cpp>

[env:prog4]
build_src_filter = -<*> +<prog4_led_task.cpp>

[env:prog5]
build_src_filter = -<*> +<prog5_temp.cpp>

[env:prog6]
build_src_filter = -<*> +<prog6_temp_async.cpp>

[env:prog7]
build_src_filter = -<*> +<prog7_temp_filter.cpp>

[env:prog8]
build_src_filter = -<*> +<prog8_led_cmd.cpp>

[env:prog9]
build_src_filter = -<*> +<prog9_led_temp.cpp>

[env:prog10]
build_src_filter = -<*> +<prog10_led_temp.cpp>
lib_deps =
    ${env.lib_deps}
    marvinroger/AsyncMqttClient
    ESP32Async/AsyncTCP

[env:production]
build_src_filter = -<*> +<prog7_temp_filter.cpp>
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=0

[env:diagnostic]
build_src_filter = -<*> +<prog7_temp_filter.cpp>
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DENABLE_SENSOR_LOG=1