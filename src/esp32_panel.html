<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 kontrolna tabla</title>
<style>
:root{
  --bg:#e8ecef; --panel:#ffffff; --ink:#16202b; --mute:#5b6978; --line:#cdd6de;
  --accent:#0b6e99; --ok:#1f7a4d; --err:#b3261e; --lamp:#16202b;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px}
main{max-width:980px;margin:0 auto;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:22px;margin:0;font-weight:650;letter-spacing:-.01em}
.status{display:flex;align-items:center;gap:10px;color:var(--mute)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--ok)}
button,input,select{font:inherit}
button{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:8px 16px;border-radius:6px;cursor:pointer}
button.ghost{background:transparent;color:var(--ink)}
button:hover{opacity:.88}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
h2{font-size:16px;margin:0 0 14px;font-weight:650}
.lampwrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.lamp{width:128px;height:128px;border-radius:50%;background:var(--lamp);border:6px solid var(--bg);outline:1px solid var(--line);transition:background .15s,box-shadow .15s}
.controls{flex:1;min-width:200px;display:grid;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
label{color:var(--mute);min-width:70px}
input[type=color]{width:56px;height:36px;padding:2px;border:1px solid var(--line);border-radius:6px;background:#fff}
input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid #fff;outline:1px solid var(--line);padding:0;cursor:pointer}
.temp{display:flex;align-items:baseline;gap:6px}
.temp b{font-size:54px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.temp span{color:var(--mute);font-size:20px}
canvas{width:100%;height:120px;display:block;margin-top:10px;border-top:1px solid var(--line)}
.hint{color:var(--mute);font-size:13px;margin:6px 0 0}
#log{height:190px;overflow:auto;background:#101820;color:#d6e2ec;border-radius:6px;padding:10px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap}
#log .tx{color:#7fc6e8}
#log .err{color:#ff9d96}
form{display:flex;gap:8px;margin-top:10px}
form input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:6px}
#warn{display:none;background:#fff3d6;border:1px solid #e0b84c;border-radius:8px;padding:12px 16px}
</style>
</head>
<body>
<main>
  <header>
    <h1>ESP32 kontrolna tabla</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="stat">Nije povezano</span>
      <button id="conn">Poveži ploču</button></div>
  </header>

  <div id="warn">Ovaj pregledač ne podržava Web Serial. Otvori stranicu u Chrome-u ili Edge-u.</div>

  <div class="grid">
    <section>
      <h2>RGB dioda</h2>
      <div class="lampwrap">
        <div class="lamp" id="lamp" aria-label="Pregled boje diode"></div>
        <div class="controls">
          <div class="row">
            <button id="pwr">Upali</button>
            <input type="color" id="pick" value="#ff0000" aria-label="Izbor boje">
          </div>
          <div class="swatches" id="sw"></div>
          <div class="row"><label for="br">Svetlina</label>
            <input type="range" id="br" min="0" max="255" value="30"><span id="brv">30</span></div>
        </div>
      </div>
    </section>

    <section>
      <h2>Temperatura (DS18B20)</h2>
      <div class="temp"><b id="t">--</b><span>°C</span></div>
      <canvas id="cv" width="600" height="120"></canvas>
      <p class="hint">Prikazuje se kad ploča ispisuje redove</code>.</p>
    </section>
  </div>

  <section>
    <h2>Serijski ispis</h2>
    <div id="log" role="log"></div>
    <form id="cmdf"><input id="cmd" placeholder="Ručna komanda, npr. help" autocomplete="off"><button>Pošalji</button></form>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let port, writer, reader, readableClosed, writerClosed;
let isOn = false, color = '#ff0000', lastSend = 0;
const temps = [];

if (!('serial' in navigator)) $('warn').style.display = 'block';

function log(text, cls) {
  const el = $('log'), s = document.createElement('span');
  if (cls) s.className = cls;
  s.textContent = text + '\n';
  el.appendChild(s);
  while (el.childNodes.length > 300) el.removeChild(el.firstChild);
  el.scrollTop = el.scrollHeight;
}

// veza
function setStatus(on) {
  $('dot').classList.toggle('on', on);
  $('stat').textContent = on ? 'Povezano (115200)' : 'Nije povezano';
  $('conn').textContent = on ? 'Prekini vezu' : 'Poveži ploču';
}

async function connect() {
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
  } catch (e) { log('Veza nije uspostavljena: ' + e.message, 'err'); return; }

  const enc = new TextEncoderStream();
  writerClosed = enc.readable.pipeTo(port.writable).catch(() => {});
  writer = enc.writable.getWriter();

  const dec = new TextDecoderStream();
  readableClosed = port.readable.pipeTo(dec.writable).catch(() => {});
  reader = dec.readable.getReader();

  setStatus(true);
  log('Povezano.');
  readLoop();
}

async function readLoop() {
  let buf = '';
  try {
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += value;
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        handleLine(buf.slice(0, i).trim());
        buf = buf.slice(i + 1);
      }
    }
  } catch (e) { log('Greška pri čitanju: ' + e.message, 'err'); }
}

async function disconnect() {
  try {
    await reader.cancel(); await readableClosed;
    await writer.close(); await writerClosed;
    await port.close();
  } catch (e) {}
  writer = null;
  setStatus(false);
  log('Veza prekinuta.');
}

$('conn').onclick = () => (writer ? disconnect() : connect());

navigator.serial && navigator.serial.addEventListener('disconnect', () => {
  writer = null; setStatus(false); log('Ploča je isključena.', 'err');
});

/* --- slanje --- */
function send(cmd) {
  if (!writer) { log('Prvo poveži ploču.', 'err'); return false; }
  writer.write(cmd + '\n');
  log('> ' + cmd, 'tx');
  return true;
}

function hexToRgb(h) {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function drawLamp() {
  const lamp = $('lamp');
  if (isOn) {
    lamp.style.background = color;
    lamp.style.boxShadow = `0 0 36px 8px ${color}88`;
  } else {
    lamp.style.background = '';
    lamp.style.boxShadow = 'none';
  }
  $('pwr').textContent = isOn ? 'Ugasi' : 'Upali';
}

function sendColor(force) {
  const now = Date.now();
  if (!force && now - lastSend < 80) return;
  lastSend = now;
  const [r, g, b] = hexToRgb(color);
  send(`rgb ${g} ${r} ${b}`);   // zamenjeni R i G: dioda na ploci ima GRB redosled
}

function setColor(c, force = true) {
  color = c; $('pick').value = c; isOn = true; drawLamp(); sendColor(force);
}

$('pwr').onclick = () => {
  if (isOn) { if (send('off')) { isOn = false; drawLamp(); } }
  else { if (send('on')) { isOn = true; drawLamp(); } }
};

$('pick').addEventListener('input', e => setColor(e.target.value, false));
$('pick').addEventListener('change', e => setColor(e.target.value, true));

$('br').addEventListener('input', e => {
  $('brv').textContent = e.target.value;
  const now = Date.now();
  if (now - lastSend > 80) { lastSend = now; send('bright ' + e.target.value); }
});
$('br').addEventListener('change', e => send('bright ' + e.target.value));

[['#ff0000','crvena'],['#00ff00','zelena'],['#0000ff','plava'],['#ffffff','bela'],
 ['#ffff00','žuta'],['#00ffff','cijan'],['#ff00ff','magenta'],['#ff8000','narandžasta']]
.forEach(([c, name]) => {
  const b = document.createElement('button');
  b.className = 'sw'; b.style.background = c; b.title = name; b.setAttribute('aria-label', name);
  b.onclick = () => setColor(c);
  $('sw').appendChild(b);
});

$('cmdf').onsubmit = e => {
  e.preventDefault();
  const v = $('cmd').value.trim();
  if (v && send(v)) $('cmd').value = '';
};

/* --- prijem --- */
function handleLine(line) {
  if (!line) return;
  log(line);
  const m = line.match(/Temp[^:]*:\s*(-?\d+(?:\.\d+)?)/i);
  if (m) {
    const v = parseFloat(m[1]);
    $('t').textContent = v.toFixed(2);
    temps.push(v); if (temps.length > 60) temps.shift();
    drawChart();
  }
}

function drawChart() {
  const cv = $('cv'), ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);
  if (temps.length < 2) return;
  const min = Math.min(...temps) - 0.5, max = Math.max(...temps) + 0.5;
  ctx.strokeStyle = '#0b6e99'; ctx.lineWidth = 2; ctx.beginPath();
  temps.forEach((v, i) => {
    const x = (i / (temps.length - 1)) * (W - 8) + 4;
    const y = H - 8 - ((v - min) / (max - min)) * (H - 16);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.stroke();
  ctx.fillStyle = '#5b6978'; ctx.font = '12px sans-serif';
  ctx.fillText(max.toFixed(1), 6, 12);
  ctx.fillText(min.toFixed(1), 6, H - 2);
}

drawLamp();
</script>
</body>
</html>
